name: Sincronizar ambgeo/Youtube

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar com ambgeo/Youtube
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/ambgeo/Youtube.git
          git fetch upstream main

          # Mantém este workflow e sincroniza todo o restante com o upstream.
          git checkout upstream/main -- .
          git checkout HEAD -- .github/workflows/sync-upstream.yml || true

          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma atualização encontrada."
          else
            git commit -m "Sincroniza com ambgeo/Youtube"
            git push origin HEAD:main
          fi
